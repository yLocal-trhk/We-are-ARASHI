<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>We are ARASHI｜グッズ購入メモ</title>

<style>
body {
  background: linear-gradient(
    to right,
    #E3FFE9,  /* 相葉：淡い緑 */
    #F3E8FF,  /* 松本：淡い紫 */
    #FFF9D9,  /* 二宮：淡い黄 */
    #E8F1FF,  /* 大野：淡い青 */
    #FFE3E3   /* 櫻井：淡い赤 */
  );
}


html, body { margin:0; padding:0; font-family:sans-serif; }
.main { padding:16px; }

.main-title { text-align:center; padding:24px 10px; background:#f8f8f8; }
.main-title .anniv { display:block; font-size:14px; letter-spacing:1px; }
.main-title .title-main { display:block; font-size:24px; font-weight:900; margin-top:4px; }

.summary-fixed {
  position:sticky; top:0; background:#fff; border-bottom:2px solid #000;
  padding:12px 16px; display:flex; justify-content:space-between; align-items:center; z-index:10;
}

.group-title {
  font-weight:bold;
  margin-top:28px;
  padding-top:12px;
  padding-bottom:6px;
  border-bottom:1px solid #000;
  font-size:16px;
}

/* ▼ 単独商品の区切り線（薄い） */
.single-item {
  border-bottom:1px solid #eee;
}

/* ▼ 複数種類 → 単独商品の切り替わり線（太め） */
.section-divider {
  border-bottom:2px solid #000;
  margin-top:20px;
}

.item {
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.item.last {
  border-bottom:none;
}

.label { flex:1; }

/* ▼ スマホだけ商品名を少し小さくする */
@media (max-width: 480px) {
  .label {
    font-size: 14px;
  }
}

/* ▼ PC（デフォルトサイズ） */
input {
  width: 44px;
  font-size: 16px;
}

.qty-btn {
  width: 36px;
  height: 36px;
}

.price { font-size:12px; color:#666; margin-left:6px; }

@media (max-width: 480px) {
  input {
    width: 30px;
    font-size: 14px;
  }

  .qty-btn {
    width: 30px;
    height: 30px;
  }
}

button.save-btn { background:#000; color:#fff; border:none; padding:8px 14px; }
button.reset-btn { background:#999; color:#fff; border:none; padding:8px 14px; }

/* ▼ スマホだけボタンをコンパクトにする */
@media (max-width: 480px) {
  .save-btn,
  .reset-btn {
    padding: 6px 10px;
    font-size: 13px;
    border-radius: 6px;
  }

  .summary-fixed {
    padding: 10px 12px;
  }

  .summary-fixed div {
    font-size: 14px;
  }
}

.creator {
  margin-top: 40px;
  padding: 20px 0;
  text-align: center;
  font-size: 14px;
  color: #444;
}

.creator-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: #444;
  text-decoration: none;
}

.creator-link svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

.home-back {
  margin: 24px 0;
  text-align: center;
}

.home-link {
  display: inline-block;
  padding: 10px 18px;
  border-radius: 999px;
  background-color: #606060;
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
}

.home-link:hover {
  opacity: 0.85;
}


</style>
</head>

<body>

<h1 class="main-title">
  <span class="anniv">Goods List</span>
  <span class="title-main">We are ARASHI</span>
</h1>

<div class="summary-fixed">
  <div>
    合計：<span id="totalQty">0</span>点 / ¥<span id="totalPrice">0</span>
  </div>
  <div style="display:flex; gap:8px;">
    <button class="save-btn" onclick="saveAsImage()">画像で保存</button>
    <button class="reset-btn" onclick="resetAll()">リセット</button>
  </div>
</div>

<div class="main" id="list"></div>

<script>
const MEMBERS = ["相葉","松本","二宮","大野","櫻井"];
const TOUR_NAMES = Array.from({length:38}, (_,i)=>`LIVE ${i+1}`);

const ITEMS = [
  { name: "ジャンボうちわ", price: 800, names: MEMBERS },
  { name: "クリアファイル", price: 600, names: [...MEMBERS, "集合"] },
  { name: "歴代ツアーロゴマグネット", price: 500, names: TOUR_NAMES },

  { name: "パンフレット（会場先行）", price: 2500 },
  { name: "ARASHIライト", price: 5500 },
  { name: "ショッピングバッグ", price: 3200 },
  { name: "Tシャツ", price: 4500 },
  { name: "バスタオル", price: 3800 },
  { name: "ポーチ", price: 2800 },
  { name: "PVCコースター", price: 1000 },
  { name: "フォンタブストラップ", price: 1800 },
  { name: "チェンジングマグカップ", price: 3500 },
  { name: "ライブフォトマスキングテープ", price: 1200 },
  { name: "We are ARASHIロゴマグネット", price: 800 },
  { name: "ミニうちわ", price: 400 },
  { name: "ヘアクリップ", price: 900 }
];


const list = document.getElementById("list");

let multiEnded = false; // 複数種類が終わったかどうか

ITEMS.forEach((item, i) => {

  // ▼ 複数種類の商品
  if (item.names) {

    const title = document.createElement("div");
    title.className = "group-title";
    title.textContent = `■ ${item.name}`;
    list.appendChild(title);

    item.names.forEach((n, t) => {
      const row = document.createElement("div");
      row.className = "item" + (t === item.names.length - 1 ? " last" : "");

      row.innerHTML = `
        <span class="label">${n}<span class="price"> ¥${item.price.toLocaleString()}</span></span>
        <button class="qty-btn" onclick="changeQty('${i}_${t}', -1)">−</button>
        <input id="qty_${i}_${t}" type="number" value="0" min="0" oninput="calc()" />
        <button class="qty-btn" onclick="changeQty('${i}_${t}', 1)">＋</button>
      `;
      list.appendChild(row);
    });

  } else {

    // ▼ 複数種類 → 単独商品の切り替わり位置に太線
    if (!multiEnded) {
      const divider = document.createElement("div");
      divider.className = "section-divider";
      list.appendChild(divider);
      multiEnded = true;
    }

    // ▼ 単独商品（薄い線で区切る）
    const row = document.createElement("div");
    row.className = "item single-item";

    row.innerHTML = `
      <span class="label">${item.name}<span class="price"> ¥${item.price.toLocaleString()}</span></span>
      <button class="qty-btn" onclick="changeQty('${i}_0', -1)">−</button>
      <input id="qty_${i}_0" type="number" value="0" min="0" oninput="calc()" />
      <button class="qty-btn" onclick="changeQty('${i}_0', 1)">＋</button>
    `;
    list.appendChild(row);
  }
});
function changeQty(key, diff) {
  const el = document.getElementById(`qty_${key}`);
  el.value = Math.max(0, Number(el.value) + diff);
  calc();
}

function calc() {
  let qty = 0, price = 0;

  ITEMS.forEach((item, i) => {
    const names = item.names ?? [""];
    names.forEach((_, t) => {
      const v = Number(document.getElementById(`qty_${i}_${t}`).value);
      qty += v;
      price += v * item.price;
    });
  });

  totalQty.textContent = qty;
  totalPrice.textContent = price.toLocaleString();
  saveData();
}

function saveData() {
  const data = {};
  ITEMS.forEach((item, i) => {
    const names = item.names ?? [""];
    names.forEach((_, t) => {
      data[`${i}_${t}`] = document.getElementById(`qty_${i}_${t}`).value;
    });
  });
  localStorage.setItem("We are ARASHIMemo", JSON.stringify(data));
}

function loadData() {
  const data = JSON.parse(localStorage.getItem("We are ARASHIMemo") || "{}");
  Object.keys(data).forEach(key => {
    const el = document.getElementById(`qty_${key}`);
    if (el) el.value = data[key];
  });
}

function resetAll() {
  if (!confirm("すべてリセットしますか？")) return;
  localStorage.removeItem("We are ARASHIMemo");
  ITEMS.forEach((item, i) => {
    const names = item.names ?? [""];
    names.forEach((_, t) => {
      document.getElementById(`qty_${i}_${t}`).value = 0;
    });
  });
  calc();
}

/* ▼ 画像保存 */
function saveAsImage() {
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  const lines = [];

  let totalQtyVal = 0;
  let totalPriceVal = 0;

  // ▼ 画像の最上部にタイトル2行を追加
  lines.push({ type: "header1", text: "Goods List" });
  lines.push({ type: "header2", text: "We are ARASHI" });
  lines.push({ type: "space", text: "" });

  ITEMS.forEach((item, i) => {
    const names = item.names ?? [""];

    let rows = [];

    names.forEach((n, t) => {
      const el = document.getElementById(`qty_${i}_${t}`);
      if (!el) return;

      const v = Number(el.value);
      if (!v) return;

      const label = n || item.name;
      rows.push(`${label} ×${v}　¥${(v * item.price).toLocaleString()}`);

      totalQtyVal += v;
      totalPriceVal += v * item.price;
    });

    if (rows.length) {
      lines.push({ type: "title", text: `■ ${item.name}` });
      rows.forEach(r => lines.push({ type: "row", text: r }));
      lines.push({ type: "space", text: "" });
    }
  });

  lines.push({ type: "total", text: `合計 ${totalQtyVal}点　¥${totalPriceVal.toLocaleString()}` });

  // ▼ 高さを最小限に
  canvas.width = 800;
  canvas.height = 60 + lines.length * 28;

// ▼ グラデーション背景（ARASHIメンバーカラー順）
const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
grad.addColorStop(0.0, "#E3FFE9"); // 相葉：緑
grad.addColorStop(0.25, "#F3E8FF"); // 松本：紫
grad.addColorStop(0.50, "#FFF9D9"); // 二宮：黄
grad.addColorStop(0.75, "#E8F1FF"); // 大野：青
grad.addColorStop(1.0, "#FFE3E3"); // 櫻井：赤

ctx.fillStyle = grad;
ctx.fillRect(0, 0, canvas.width, canvas.height);

  let y = 40;

  lines.forEach(line => {
    if (line.type === "header1") {
  ctx.font = "bold 24px sans-serif";
  ctx.fillStyle = "#000";
  ctx.fillText(line.text, 40, y);
  y += 32;
  return;
}

if (line.type === "header2") {
  ctx.font = "bold 34px sans-serif"; // ← 大きくした！
  ctx.fillStyle = "#000";
  ctx.fillText(line.text, 40, y);
  y += 40; // ← 行間も少し広げる
  return;
}

    if (line.type === "title") {
      ctx.font = "bold 20px sans-serif";
    } else if (line.type === "total") {
      ctx.font = "bold 22px sans-serif";
    } else {
      ctx.font = "18px sans-serif";
    }

    ctx.fillStyle = "#000";
    ctx.fillText(line.text, 40, y);

    if (line.type === "row") {
      ctx.strokeStyle = "#ccc";
      ctx.beginPath();
      ctx.moveTo(40, y + 6);
      ctx.lineTo(760, y + 6);
      ctx.stroke();
    }

    y += 28;
  });

  const a = document.createElement("a");
  a.download = "we_are_arashi_selected.png";
  a.href = canvas.toDataURL("image/png");
  a.click();
}
loadData();
calc();
</script>

<div class="home-back">

</div>

</div>


</body>
